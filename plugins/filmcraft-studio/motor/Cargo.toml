[package]
name = "cine"
version = "0.4.0"
edition = "2021"
description = "Motor determinista de filmcraft-studio: valida design systems, elige el DS, comprueba la biblia, puntúa el montaje y decide la versión mejor"
license = "MIT"

[[bin]]
name = "cine"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
